name: Windows source build verification
on:
  pull_request:
    paths:
      - 'die_shift_studio/**'
      - 'tools/package_release.py'
      - 'tools/windows_acceptance.py'
      - 'tests/gui_v30.py'
      - 'tests/gui_v32.py'
      - 'tests/test_v32.py'
      - 'tests/cuda_test_driver.cpp'
      - 'main.py'
      - 'BUILD.bat'
      - 'RUN.bat'
      - 'requirements.txt'
      - 'Die_Shift_Analyze.spec'
      - '.gitattributes'
      - '.github/workflows/windows-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [clean, with-cupy]
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare the Windows test environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install -r requirements.txt
      - name: Exercise an existing CuPy build environment
        if: matrix.environment == 'with-cupy'
        run: .\.venv\Scripts\python -m pip install cupy-cuda12x
      - name: Generate and expand the actual source-only ZIP
        run: |
          $py = (Get-Item .\.venv\Scripts\python.exe).FullName
          $out = Join-Path $env:RUNNER_TEMP "源码 package"
          & $py tools/package_release.py make-source --output "$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-Item "$out\*_Source.zip"
          $expected = (Get-FileHash -LiteralPath $zip.FullName).Hash
          $env:GIT_CONFIG_COUNT = '1'; $env:GIT_CONFIG_KEY_0 = 'core.autocrlf'
          foreach ($mode in 'true','false') {
            $env:GIT_CONFIG_VALUE_0 = $mode
            & $py tools/package_release.py make-source --output "$out\$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ((Get-FileHash -LiteralPath "$out\$mode\$($zip.Name)").Hash -ne $expected) {
              throw "Source ZIP depends on Git line endings"
            }
          }
          Remove-Item Env:GIT_CONFIG_COUNT,Env:GIT_CONFIG_KEY_0,Env:GIT_CONFIG_VALUE_0
          $expand = Join-Path $env:RUNNER_TEMP "目标 Windows"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $expand
          $source = Join-Path $expand $zip.BaseName
          "DSA_TEST_SOURCE=$source" >> $env:GITHUB_ENV
          "DIE_SHIFT_PYTHON=$py" >> $env:GITHUB_ENV
      - name: Locate the Windows C++ compiler for the interface test
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC not found' }
          "DSA_VCVARS=$vs\VC\Auxiliary\Build\vcvars64.bat" >> $env:GITHUB_ENV
      - name: Check the native ABI and kernel arithmetic with a CPU test driver
        shell: cmd
        run: |
          call "%DSA_VCVARS%" >nul
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v32.py -v
      - name: Verify hardware preference and pending Qt worker shutdown
        shell: cmd
        run: '"%DIE_SHIFT_PYTHON%" tests/gui_v32.py'
      - name: Exercise the one-click BUILD.bat from the extracted source
        shell: cmd
        run: call "%DSA_TEST_SOURCE%\BUILD.bat"
      - name: Verify the startup and clean up the temporary executable
        run: |
          try {
            & $env:DIE_SHIFT_PYTHON tools/windows_acceptance.py --source-root "$env:DSA_TEST_SOURCE"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath "$env:DSA_TEST_SOURCE\dist" -Recurse -Force -ErrorAction SilentlyContinue
          }
