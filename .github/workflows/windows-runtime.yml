name: Windows source build verification
on:
  pull_request:
    paths:
      - 'die_shift_studio/**'
      - 'RealDataAnalyse/**'
      - 'Jobs/GD55/**'
      - 'tests/test_realdata_projects.py'
      - 'tests/test_v46.py'
      - 'tests/test_evaluation_scope.py'
      - 'tests/gui_evaluation_scope.py'
      - 'tests/gui_realdata_projects.py'
      - 'tests/test_v47.py'
      - 'tests/gui_v47.py'
      - 'tests/test_v45.py'
      - 'tests/test_v46.py'
      - 'tests/test_evaluation_scope.py'
      - 'tests/gui_evaluation_scope.py'
      - 'tests/gui_v45.py'
      - 'tests/test_v44.py'
      - 'tests/test_realdata_plans.py'
      - 'tests/gui_realdata_plans*.py'
      - 'tests/gui_realdata_instances.py'
      - 'tests/gui_realdata_errors.py'
      - 'tests/test_realdata_errors.py'
      - 'tests/test_oas_errors.py'
      - 'tests/test_oas_template.py'
      - 'tests/test_gd55_cases.py'
      - 'tests/test_v52.py'
      - 'tests/test_v54.py'
      - 'tests/test_v51.py'
      - 'tests/test_v50.py'
      - 'tests/gui_v50.py'
      - 'tests/test_oriented_oas_errors.py'
      - 'tests/test_v49_reconstruction.py'
      - 'tests/test_measured_issue_concurrency.py'
      - 'tests/gui_v49.py'
      - 'tests/gui_v49_gd55.py'
      - 'tests/gui_v44*.py'
      - 'tools/package_release.py'
      - 'tools/windows_acceptance.py'
      - 'tests/gui_v30.py'
      - 'tests/gui_v32.py'
      - 'tests/gui_v33.py'
      - 'tests/test_v33.py'
      - 'tests/test_v34.py'
      - 'tests/gui_v34.py'
      - 'tests/test_v35.py'
      - 'tests/gui_v35.py'
      - 'tests/test_v36.py'
      - 'tests/gui_v36.py'
      - 'tests/test_v32.py'
      - 'tests/test_reconstruction.py'
      - 'tests/gui_v38.py'
      - 'tests/gui_v39.py'
      - 'tests/gui_v40.py'
      - 'tests/test_v40.py'
      - 'tests/gui_v41.py'
      - 'tests/test_v41.py'
      - 'tests/test_v43.py'
      - 'tests/gui_v43*.py'
      - 'tools/verify_measured_gd55.py'
      - 'tests/test_v38.py'
      - 'tests/test_v39*.py'
      - 'tests/test_branch_integration.py'
      - 'tests/cuda_test_driver.cpp'
      - 'main.py'
      - 'BUILD.bat'
      - 'RUN.bat'
      - 'requirements.txt'
      - 'Die_Shift_Analyze.spec'
      - '.gitattributes'
      - '.github/workflows/windows-runtime.yml'
  workflow_dispatch:
    inputs:
      resume_v53_tail:
        description: 'Continue from the V41 rotation test after its fixture update'
        type: boolean
        default: false
      resume_v52_client:
        description: 'Resume V52 client and build acceptance after the completion-dialog fix'
        type: boolean
        default: false
      resume_v52_tail:
        description: 'Resume V52 after the node edit compatibility fix'
        type: boolean
        default: false
      resume_v52:
        description: 'Verify the single-active-axis scope fix without repeating the complete V52 Windows pass'
        type: boolean
        default: false
      resume_v51:
        description: 'Verify V51 pose switching, live boundary edits and template compatibility after the full pass'
        type: boolean
        default: false
      resume_v50:
        description: 'Continue the V50 acceptance after its focused GD55 performance fix; skip previously passed suites'
        type: boolean
        default: false
      resume_v50_tail:
        description: 'Continue after V50 legacy overlay fixture compatibility; run only affected and unfinished checks'
        type: boolean
        default: false

permissions:
  contents: read
jobs:
  build:
    if: ${{ inputs.resume_v52 != true }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [clean, with-cupy]
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare the Windows test environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install -r requirements.txt ezdxf
      - name: V47 measured commands, compact focus and saved geometry regression
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v52_tail != true && inputs.resume_v51 != true && inputs.resume_v50 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          .\.venv\Scripts\python -m unittest discover -s tests -p test_v47.py -v
          if errorlevel 1 exit /b 1
          .\.venv\Scripts\python -m unittest discover -s tests -p test_v46.py -v
          if errorlevel 1 exit /b 1
          .\.venv\Scripts\python -m unittest discover -s tests -p test_evaluation_scope.py -v
          if errorlevel 1 exit /b 1
          .\.venv\Scripts\python tests/gui_evaluation_scope.py
          if errorlevel 1 exit /b 1
      - name: Exercise an existing CuPy build environment
        if: matrix.environment == 'with-cupy'
        run: .\.venv\Scripts\python -m pip install cupy-cuda12x
      - name: Generate and expand the actual source-only ZIP
        run: |
          $py = (Get-Item .\.venv\Scripts\python.exe).FullName
          $out = Join-Path $env:RUNNER_TEMP "源码 package"
          & $py tools/package_release.py make-source --output "$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-Item "$out\*_Source.zip"
          $expected = (Get-FileHash -LiteralPath $zip.FullName).Hash
          $env:GIT_CONFIG_COUNT = '1'; $env:GIT_CONFIG_KEY_0 = 'core.autocrlf'
          foreach ($mode in 'true','false') {
            $env:GIT_CONFIG_VALUE_0 = $mode
            & $py tools/package_release.py make-source --output "$out\$mode"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ((Get-FileHash -LiteralPath "$out\$mode\$($zip.Name)").Hash -ne $expected) {
              throw "Source ZIP depends on Git line endings"
            }
          }
          Remove-Item Env:GIT_CONFIG_COUNT,Env:GIT_CONFIG_KEY_0,Env:GIT_CONFIG_VALUE_0
          $expand = Join-Path $env:RUNNER_TEMP "目标 Windows"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $expand
          $source = Join-Path $expand $zip.BaseName
          "DSA_TEST_SOURCE=$source" >> $env:GITHUB_ENV
          "DIE_SHIFT_PYTHON=$py" >> $env:GITHUB_ENV
      - name: Verify ordered plans, output isolation and bounded IPC conversation
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v52_tail != true && inputs.resume_v51 != true && inputs.resume_v50 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_realdata_plans.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_realdata_plans.py
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_realdata_plans_process.py
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_realdata_instances.py
      - name: Verify partial measured output, ERROR layer and expanded GD55
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v52_tail != true && inputs.resume_v51 != true && inputs.resume_v50 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_oas_errors.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_oas_template.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_measured_issue_concurrency.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_realdata_errors.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_gd55_cases.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_realdata_errors.py
      - name: Verify V50 output, pair coverage, DRC policy and interaction contracts
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v52_tail != true && inputs.resume_v51 != true && inputs.resume_v50 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v52.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v51.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v50.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_oriented_oas_errors.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_fail_oas.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v50.py
          if errorlevel 1 exit /b 1
      - name: Verify V49 reconstruction rules, ruler and GD55 interactions
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v52_tail != true && inputs.resume_v51 != true && inputs.resume_v50 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v49_reconstruction.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v49.py
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v49_gd55.py
      - name: Resume only affected V50 focused assessment and GD55 handles
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v52_tail != true && inputs.resume_v51 != true && inputs.resume_v50 == true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest test_v26.V26Tests.test_all_729_statuses_match_full_geometry_and_drc test_evaluation_scope -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v49_gd55.py
          if errorlevel 1 exit /b 1
      - name: Locate the Windows C++ compiler for the interface test
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v52_tail != true && inputs.resume_v51 != true && inputs.resume_v50_tail != true }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC not found' }
          "DSA_VCVARS=$vs\VC\Auxiliary\Build\vcvars64.bat" >> $env:GITHUB_ENV
      - name: Check the native ABI and kernel arithmetic with a CPU test driver
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v52_tail != true && inputs.resume_v51 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          call "%DSA_VCVARS%" >nul
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v32.py -v
      - name: Verify V45 current copper DRC and lazy compact GUI
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v52_tail != true && inputs.resume_v51 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v45.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v45.py
      - name: Verify hardware preference and pending Qt worker shutdown
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v52_tail != true && inputs.resume_v51 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: '"%DIE_SHIFT_PYTHON%" tests/gui_v32.py'
      - name: Verify joint width probabilities and context menu
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v52_tail != true && inputs.resume_v51 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v33.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v33.py
      - name: Verify two yields and keepout-aware channels
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v52_tail != true && inputs.resume_v51 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v34.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v34.py
      - name: Verify V52 node edits after short-edge filtering
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v52_tail == true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest test_v52 test_v43 -v
      - name: Verify rare-event integration, exhaustive grids and straight DXF
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v51 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v35.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v35.py
      - name: Verify merged DXF and width probability presentation
        if: ${{ inputs.resume_v53_tail != true && inputs.resume_v52_client != true && inputs.resume_v51 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v36.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v36.py
      - name: Verify editable V41 zones, cancel and exact ABC
        if: ${{ inputs.resume_v52_client != true && inputs.resume_v51 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v41.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v41.py
      - name: Verify V42 branches and saved results
        if: ${{ inputs.resume_v52_client != true && inputs.resume_v51 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest test_v54 -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v42.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v42.py
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v42_branches.py
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v42_saved_process.py
      - name: Verify V43 local named-pipe IPC and OAS output
        if: ${{ inputs.resume_v52_client != true && inputs.resume_v51 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v43.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v47.py
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v43.py
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v43_process.py
      - name: Verify integrated cut editing and source entry compatibility
        if: ${{ inputs.resume_v52_client != true && inputs.resume_v51 != true && inputs.resume_v50_tail != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_reconstruction.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_branch_integration.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v38.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v38.py
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p "test_v39*.py" -v
          if errorlevel 1 exit /b %errorlevel%
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v40.py -v
          if errorlevel 1 exit /b %errorlevel%
          "%DIE_SHIFT_PYTHON%" tests/gui_v40.py
          if errorlevel 1 exit /b %errorlevel%
          "%DIE_SHIFT_PYTHON%" tests/gui_v39.py
      - name: Continue V50 tail without replaying passed suites
        if: ${{ inputs.resume_v52_client != true && inputs.resume_v51 != true && inputs.resume_v50_tail == true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest test_v39.V39Tests.test_shared_source_paints_union_of_all_fixed_regions test_v50.V50Tests.test_enclosure_actual_value_is_local_to_each_reported_witness -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v40.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v40.py
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v39.py
          if errorlevel 1 exit /b 1
      - name: Verify V44 Excel client and durable recovery
        if: ${{ inputs.resume_v52_client != true && inputs.resume_v51 != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v44.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_reconstruction_continuity.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v44.py
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v44_process.py
      - name: Verify project-folder client and continuous Windows progress
        if: ${{ inputs.resume_v51 != true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_v46.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -m unittest discover -s tests -p test_realdata_projects.py -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" -X faulthandler -u tests/gui_realdata_projects.py
      - name: Verify V51 changed GUI and template behavior
        if: ${{ inputs.resume_v51 == true }}
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          "%DIE_SHIFT_PYTHON%" -m unittest test_v42 test_v50 test_v51 test_oas_template -v
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v50.py
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_v38.py
          if errorlevel 1 exit /b 1
          "%DIE_SHIFT_PYTHON%" tests/gui_realdata_errors.py
      - name: Exercise the one-click BUILD.bat from the extracted source
        shell: cmd
        run: call "%DSA_TEST_SOURCE%\BUILD.bat"
      - name: Verify the startup and clean up the temporary executable
        run: |
          try {
            & $env:DIE_SHIFT_PYTHON tools/windows_acceptance.py --source-root "$env:DSA_TEST_SOURCE"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath "$env:DSA_TEST_SOURCE\dist" -Recurse -Force -ErrorAction SilentlyContinue
          }

  v52-scope-followup:
    if: ${{ inputs.resume_v52 == true }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [clean, with-cupy]
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt ezdxf
      - name: Exercise installed CuPy
        if: matrix.environment == 'with-cupy'
        run: python -m pip install cupy-cuda12x
      - name: Verify final V52 scope and geometry regressions
        shell: cmd
        run: |
          set PYTHONPATH=.;tests
          python -m unittest test_v52 test_evaluation_scope -v
          if errorlevel 1 exit /b 1
          python tests/gui_evaluation_scope.py
