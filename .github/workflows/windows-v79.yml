name: Windows offline licensing and packaging
on:
  workflow_call:
    inputs:
      client_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.client_only && '["client"]' || '["administrator","client"]') }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: '.;tests'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - if: matrix.component == 'administrator'
        run: python -m unittest -v test_v80_license test_v80_build test_v79.AuthorizationTests test_branch_integration
      - name: Build the standalone administrator tool
        if: matrix.component == 'administrator'
        run: cmd /c BUILD.bat --admin-only
      - uses: actions/upload-artifact@v4
        if: matrix.component == 'administrator'
        with:
          name: LicenseManager-windows
          path: dist_admin/LicenseManager.exe
          if-no-files-found: error
      - name: Verify missing-key preflight and build an isolated QA client
        if: matrix.component == 'client'
        shell: pwsh
        run: |
          cmd /c BUILD.bat *> missing-build-key.log
          if ($LASTEXITCODE -eq 0 -or -not (Select-String -LiteralPath missing-build-key.log -Pattern 'Client build needs the formal Ed25519 public key' -SimpleMatch)) { throw 'BUILD.bat did not report its missing key before client packaging' }
          python -m PyInstaller --clean --noconfirm Die_Shift_Analyze.spec *> missing-key.log
          if ($LASTEXITCODE -eq 0 -or -not (Select-String -LiteralPath missing-key.log -Pattern 'Formal Ed25519 public key required' -SimpleMatch)) { throw 'Missing public key did not fail closed' }
          python tools/qa_license.py
          if ($LASTEXITCODE -ne 0) { throw 'QA key setup failed' }
          python -m PyInstaller --clean --noconfirm Die_Shift_Analyze.spec
          if ($LASTEXITCODE -ne 0) { throw 'QA client build failed' }
          $process = Start-Process -Wait -PassThru dist/Die_Shift_Analyze.exe -ArgumentList '--smoke-test','qa-activated.json'
          if (Test-Path qa-hardware-valid) {
            if ($process.ExitCode -ne 0 -or -not (Test-Path qa-activated.json)) { throw 'Licensed EXE failed smoke test' }
          } else {
            if ($process.ExitCode -eq 0 -or (Test-Path qa-activated.json)) { throw 'EXE ran without a valid hardware binding' }
            Write-Warning 'Runner lacks valid CIM hardware identifiers. Real activation requires a supported computer.'
          }
      - uses: actions/upload-artifact@v4
        if: matrix.component == 'client'
        with:
          name: licensing-validation
          path: |
            qa-hardware-status.txt
            qa-activated.json
            missing-key.log
            missing-build-key.log
