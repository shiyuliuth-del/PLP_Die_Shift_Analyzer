   <g id="text_16">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #304552" transform="translate(33.301875 17.287617)">固定RDL重构预演：同一网络的落盘合成一条串、只切一刀，切口垂直于该串走线（与两侧各成 90°），</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #304552" transform="translate(87.42375 30.429492)">移动区随DIE移动，裂隙由两面切口的 4 个端点围成的多边形盖住（是否短路都补）</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #304552" transform="translate(7.2 43.631367)">移动区面积 4765.4 μm² · 切口缝长 32.0 μm · 补线面积 1120 μm² · 切口距最远落盘 56.4 μm（2.5 个落盘直径）</text>
